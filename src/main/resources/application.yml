# ============================================================
# Todo AI Agent - Application Configuration
# ============================================================

server:
  port: 8081

spring:
  application:
    name: todo-ai-agent

  # ==========================================================
  # Spring AI - OpenAI Configuration
  # ==========================================================
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: gpt-4o-mini
          temperature: 0.7
      embedding:
        options:
          model: text-embedding-3-small

    # ==========================================================
    # Vector Store - pgvector
    # initialize-schema: true → Spring AI creates todo_vector_store
    # table on startup. Do NOT insert into this table via raw JDBC.
    # ==========================================================
    vectorstore:
      pgvector:
        dimensions: 1536
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        initialize-schema: true
        vector-table-name: todo_vector_store

  # ==========================================================
  # Database - Postgres
  # ==========================================================
  datasource:
    url: jdbc:postgresql://localhost:5432/todo_ai_db
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # ==========================================================
  # Redis Cache
  # ==========================================================
  data:
    redis:
      host: ${REDIS_HOST:redis}    # 'redis' — only works in docker-compose
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:admin}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 10
          max-idle: 5
          min-idle: 2

  cache:
    type: redis
    redis:
      time-to-live: 2592000000         # 30 days in ms

# ============================================================
# Logging
# ============================================================
logging:
  level:
    com.example.todoai: DEBUG
    org.springframework.ai: INFO
    org.springframework.cache: TRACE   # shows Cache HIT / MISS in console
  pattern:
    console: "%clr(%d{HH:mm:ss.SSS}){faint} %clr(%-5level) %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %msg%n"